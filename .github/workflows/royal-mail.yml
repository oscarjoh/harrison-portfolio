
name: Royal Mail Hourly Sender

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Royal Mail
        run: |
          curl --fail --silent --show-error \
          --max-time 120 \
          "${{ secrets.ROYAL_MAIL_CRON_URL }}"
