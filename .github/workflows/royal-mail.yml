
name: Royal Mail Hourly Sender

on:
  schedule:
    - cron: '22 * * * *'
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Validate Cron URL
        env:
          CRON_URL: ${{ secrets.ROYAL_MAIL_CRON_URL }}
        run: |
          if [ -z "$CRON_URL" ]; then
            echo "ERROR: ROYAL_MAIL_CRON_URL secret is missing."
            exit 1
          fi

      - name: Trigger Royal Mail
        env:
          CRON_URL: ${{ secrets.ROYAL_MAIL_CRON_URL }}
        run: |
          HTTP_CODE=$(curl \
            --http1.1 \
            --silent \
            --show-error \
            --location \
            --max-time 180 \
            --user-agent "RoyalMail-GitHub-Actions/1.0" \
            --output response.txt \
            --write-out "%{http_code}" \
            "$CRON_URL")

          CURL_EXIT=$?

          echo "Curl exit code: $CURL_EXIT"
          echo "HTTP status: $HTTP_CODE"
          echo "Server response:"
          cat response.txt 2>/dev/null || true

          if [ "$CURL_EXIT" -ne 0 ]; then
            exit "$CURL_EXIT"
          fi

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "ERROR: Server returned HTTP $HTTP_CODE"
            exit 1
          fi
